<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Giovanna Souza</title>
  <desc id="desc">Banner roxo animado. Sistemas de Informação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d0819"/>
      <stop offset=".55" stop-color="#341064"/>
      <stop offset="1" stop-color="#792bd3"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#bf8bff" stop-opacity=".3"/><stop offset="1" stop-color="#bf8bff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <ellipse cx="720" cy="120" rx="190" ry="120" fill="url(#glow)">
    <animate attributeName="cx" values="720;570;720" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke="#d3b5ff" stroke-opacity=".13">
    <circle cx="810" cy="35" r="145"/><circle cx="810" cy="35" r="180"/>
    <path d="M30 210H870M30 30H870"/>
  </g>
  <g fill="#e3d0ff">
    <circle cx="95" cy="75" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="177" r="3"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="60" r="2"/><circle cx="163" cy="184" r="1.5"/>
  </g>
  <text x="450" y="75" text-anchor="middle" fill="#ccb3eb" font-family="monospace" font-size="12" letter-spacing="5">HELLO, WORLD_</text>
  <text x="450" y="132" text-anchor="middle" fill="#faf5ff" font-family="Arial, sans-serif" font-weight="700" font-size="48" letter-spacing="2">GIOVANNA SOUZA</text>
  <text x="450" y="168" text-anchor="middle" fill="#dfcbf7" font-family="Arial, sans-serif" font-size="17" letter-spacing="3">SISTEMAS DE INFORMAÇÃO</text>
</svg>
